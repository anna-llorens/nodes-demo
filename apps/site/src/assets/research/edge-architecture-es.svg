<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Los datos en bruto acaban en el nodo; solo viajan métricas" font-family="Inter, system-ui, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="352" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6E74"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" fill="#0B0D17">Los datos en bruto acaban en el nodo; solo viajan métricas</text>
<g fill="none" stroke="#6B6E74" stroke-width="1.25"><path d="M164 148H194" marker-end="url(#a)"/><path d="M428 148H474" marker-end="url(#a)"/><path d="M588 148H610" marker-end="url(#a)"/><path d="M312 224V250" marker-end="url(#a)"/></g>
<rect x="24" y="80" width="140" height="136" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="94" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Sensores</text>
<text x="94" y="128" text-anchor="middle" font-size="11.5" fill="#0B0D17">LiDAR o cámara</text>
<text x="94" y="144" text-anchor="middle" font-size="11.5" fill="#6B6E74">nubes de puntos</text>
<text x="94" y="160" text-anchor="middle" font-size="11.5" fill="#6B6E74">o vídeo en bruto</text>
<text x="94" y="184" text-anchor="middle" font-size="11.5" fill="#6B6E74">por cable, con PTP</text>
<rect x="196" y="72" width="232" height="152" rx="8" fill="#E2F1EA" stroke="#237A5D" stroke-width="2"/>
<text x="312" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Nodo de borde</text>
<text x="312" y="116" text-anchor="middle" font-size="11.5" fill="#0B0D17">Driver y marcas de tiempo</text>
<text x="312" y="132" text-anchor="middle" font-size="11.5" fill="#0B0D17">Quitar suelo y fondo</text>
<text x="312" y="148" text-anchor="middle" font-size="11.5" fill="#0B0D17">Detección y seguimiento</text>
<text x="312" y="164" text-anchor="middle" font-size="11.5" fill="#0B0D17">Agregación por zonas</text>
<text x="312" y="180" text-anchor="middle" font-size="11.5" fill="#0B0D17">Reglas locales</text>
<text x="312" y="196" text-anchor="middle" font-size="11.5" fill="#0B0D17">Búfer en disco; descarta lo bruto</text>
<rect x="208" y="252" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="312" y="276" text-anchor="middle" font-size="13" fill="#0B0D17">Alerta local, funciona sin red</text>
<rect x="476" y="104" width="112" height="88" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="532" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Red</text>
<text x="532" y="144" text-anchor="middle" font-size="11.5" fill="#6B6E74">LAN por cable</text>
<text x="532" y="160" text-anchor="middle" font-size="11.5" fill="#6B6E74">o 4G/5G</text>
<text x="532" y="176" text-anchor="middle" font-size="11.5" fill="#0B0D17">solo métricas</text>
<rect x="612" y="96" width="124" height="104" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="674" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Sitio o nube</text>
<text x="674" y="136" text-anchor="middle" font-size="11.5" fill="#6B6E74">fusión de nodos</text>
<text x="674" y="152" text-anchor="middle" font-size="11.5" fill="#6B6E74">histórico</text>
<text x="674" y="168" text-anchor="middle" font-size="11.5" fill="#6B6E74">panel</text>
<text x="674" y="184" text-anchor="middle" font-size="11.5" fill="#6B6E74">envío de alertas</text>
<line x1="452" y1="56" x2="452" y2="308" stroke="#C0392B" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="452" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0B0D17">Frontera de privacidad: los datos en bruto no la cruzan</text>
</svg>