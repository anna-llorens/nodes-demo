<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Raw data ends on the node; only metrics travel" font-family="Inter, system-ui, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="352" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6E74"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-size="15" font-weight="600" fill="#0B0D17">Raw data ends on the node; only metrics travel</text>
<g fill="none" stroke="#6B6E74" stroke-width="1.25"><path d="M164 148H194" marker-end="url(#a)"/><path d="M428 148H474" marker-end="url(#a)"/><path d="M588 148H610" marker-end="url(#a)"/><path d="M312 224V250" marker-end="url(#a)"/></g>
<rect x="24" y="80" width="140" height="136" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="94" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Sensors</text>
<text x="94" y="128" text-anchor="middle" font-size="11.5" fill="#0B0D17">LiDAR or camera</text>
<text x="94" y="144" text-anchor="middle" font-size="11.5" fill="#6B6E74">raw point clouds</text>
<text x="94" y="160" text-anchor="middle" font-size="11.5" fill="#6B6E74">or video</text>
<text x="94" y="184" text-anchor="middle" font-size="11.5" fill="#6B6E74">wired, PTP-synced</text>
<rect x="196" y="72" width="232" height="152" rx="8" fill="#E2F1EA" stroke="#237A5D" stroke-width="2"/>
<text x="312" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Edge node</text>
<text x="312" y="116" text-anchor="middle" font-size="11.5" fill="#0B0D17">Driver and timestamps</text>
<text x="312" y="132" text-anchor="middle" font-size="11.5" fill="#0B0D17">Ground and background removal</text>
<text x="312" y="148" text-anchor="middle" font-size="11.5" fill="#0B0D17">Detection and tracking</text>
<text x="312" y="164" text-anchor="middle" font-size="11.5" fill="#0B0D17">Zone aggregation</text>
<text x="312" y="180" text-anchor="middle" font-size="11.5" fill="#0B0D17">Local rules</text>
<text x="312" y="196" text-anchor="middle" font-size="11.5" fill="#0B0D17">Disk buffer, then discard raw</text>
<rect x="208" y="252" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="312" y="276" text-anchor="middle" font-size="13" fill="#0B0D17">Local alert, works offline</text>
<rect x="476" y="104" width="112" height="88" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="532" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Network</text>
<text x="532" y="144" text-anchor="middle" font-size="11.5" fill="#6B6E74">wired LAN</text>
<text x="532" y="160" text-anchor="middle" font-size="11.5" fill="#6B6E74">or 4G/5G</text>
<text x="532" y="176" text-anchor="middle" font-size="11.5" fill="#0B0D17">metrics only</text>
<rect x="612" y="96" width="124" height="104" rx="8" fill="#FFFFFF" stroke="#6B6E74" stroke-width="1.25"/>
<text x="674" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#0B0D17">Site or cloud</text>
<text x="674" y="136" text-anchor="middle" font-size="11.5" fill="#6B6E74">fusion of nodes</text>
<text x="674" y="152" text-anchor="middle" font-size="11.5" fill="#6B6E74">history</text>
<text x="674" y="168" text-anchor="middle" font-size="11.5" fill="#6B6E74">dashboard</text>
<text x="674" y="184" text-anchor="middle" font-size="11.5" fill="#6B6E74">alert routing</text>
<line x1="452" y1="56" x2="452" y2="308" stroke="#C0392B" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="452" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0B0D17">Privacy boundary: raw data never crosses</text>
</svg>